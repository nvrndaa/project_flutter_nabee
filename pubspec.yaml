name: flutter_nabee
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
 
  # UI
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.4
  flutter_spinkit: ^5.2.2

  # State Management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1

  # Routing
  go_router: ^17.2.2

  # Functional
  dartz: ^0.10.1

  # Utilities
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  timer_count_down: ^2.2.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

  # Database
  sqflite: ^2.4.2+1

  # Permission
  permission_handler: ^12.0.1

  # Scanner & Image
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.1
  qr_flutter: ^4.1.0

  # Printer
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.9

  # Freezed
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

  # Code Generator (STABLE COMBO)
  build_runner: ^2.4.13
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/nav/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/nabee_logo_fix.png"
  
  adaptive_icon_background: "#FFFBE7"
  adaptive_icon_foreground: "assets/images/nabee_logo_fix.png"